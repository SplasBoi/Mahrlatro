[manifest]
version = "0.6.7"
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.SPEEDFACTOR = self.SPEEDFACTOR + math.max(0, math.abs(G.ACC) - 2)"
position = "after"
payload = '''
if G.STAGE == G.STAGES.RUN and G.jokers then
    local speed_mod = 1

    for _, card in ipairs(G.jokers.cards) do
        if card and not card.debuff and card.ability and card.ability.extra then
            local e = card.ability.extra
    
            if type(e) == "table" and type(e.mahrlatr_speed_mod) == "number" then
                speed_mod = speed_mod + e.mahrlatr_speed_mod
            end
        end
    end

    self.SPEEDFACTOR = self.SPEEDFACTOR + speed_mod
end
'''
match_indent = true